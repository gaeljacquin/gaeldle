name: Worker CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/worker-ci.yml
      - apps/worker/**
      - apps/api/**
      - packages/db/**
      - packages/queue/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Worker checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck queue
        run: pnpm --filter @workspace/queue typecheck

      - name: Typecheck worker
        run: pnpm --filter @workspace/worker typecheck
